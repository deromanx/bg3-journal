name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 讓 GITHUB_TOKEN 能部署 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；不取消進行中的，讓已排隊的完成
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 整個 repo 根目錄即為靜態網站（含 .nojekyll，不跑 Jekyll）
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
