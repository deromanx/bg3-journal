<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>前進柏德之門 — 冒險日誌</title>
  <meta name="description" content="《柏德之門3》TRPG 跑團冒險日誌：影心、阿斯代倫、曹、卡拉克、貓咕咕的史詩（笑料）之旅。完整戰報、決鬥統計、靠北語錄與瓦羅的故事集。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="前進柏德之門 — 冒險日誌">
  <meta property="og:description" content="《柏德之門3》跑團日誌：完整戰報、決鬥統計、靠北語錄與瓦羅的故事集。">
  <meta property="og:url" content="https://deromanx.github.io/bg3-journal/">
  <meta property="og:image" content="https://deromanx.github.io/bg3-journal/data/images/cover.webp">
  <meta property="og:locale" content="zh_TW">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/webp" href="data/images/avatars/卡拉克.webp">
  <link rel="apple-touch-icon" href="data/images/avatars/卡拉克.webp">
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>

<div id="app">

  <!-- ── 側欄 ───────────────────────────────────── -->
  <aside id="sidebar">
    <div id="sidebar-brand" onclick="goHome()" title="回到首頁">
      <div class="brand-emblem">
        <svg viewBox="0 0 60 60" width="44" height="44" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="30" cy="30" r="28" stroke="rgba(201,168,76,0.4)" stroke-width="1"/>
          <circle cx="30" cy="30" r="22" stroke="rgba(201,168,76,0.2)" stroke-width="0.5"/>
          <!-- Crossed swords -->
          <line x1="18" y1="18" x2="42" y2="42" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="42" y1="18" x2="18" y2="42" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="30" cy="30" r="3" fill="rgba(201,168,76,0.6)"/>
          <!-- Cardinal points -->
          <circle cx="30" cy="6"  r="1.5" fill="rgba(201,168,76,0.4)"/>
          <circle cx="30" cy="54" r="1.5" fill="rgba(201,168,76,0.4)"/>
          <circle cx="6"  cy="30" r="1.5" fill="rgba(201,168,76,0.4)"/>
          <circle cx="54" cy="30" r="1.5" fill="rgba(201,168,76,0.4)"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-title">前進柏德之門</div>
        <div class="brand-subtitle">冒 險 日 誌</div>
      </div>
    </div>

    <div class="sidebar-divider"></div>

    <!-- ── 頁面切換 Tab ───────────────────────────── -->
    <div id="sidebar-tabs">
      <button class="stab active" data-view="journal" onclick="showView('journal')">
        <span class="stab-icon">📖</span><span class="stab-label">日誌</span>
      </button>
      <button class="stab" data-view="characters" onclick="showView('characters')">
        <span class="stab-icon">👤</span><span class="stab-label">冒險隊伍</span>
      </button>
      <button class="stab" data-view="stats" onclick="showView('stats')">
        <span class="stab-icon">📊</span><span class="stab-label">統計</span>
      </button>
      <button class="stab" data-view="milestones" onclick="showView('milestones')">
        <span class="stab-icon">🗺</span><span class="stab-label">里程碑</span>
      </button>
      <button class="stab" data-view="story" onclick="showView('story')">
        <span class="stab-icon">📕</span><span class="stab-label">瓦羅的故事集</span>
      </button>
    </div>

    <!-- 章節列表：只在日誌分頁顯示 -->
    <div id="journal-nav">
      <div class="nav-section-label">章 節</div>
      <nav>
        <ul id="session-list"></ul>
      </nav>
    </div>

    <!-- 故事章節：只在故事分頁顯示 -->
    <div id="story-nav" class="hidden-nav">
      <div class="nav-section-label">瓦羅的故事集</div>
      <nav>
        <ul id="story-chapter-list"></ul>
      </nav>
    </div>

    <div class="sidebar-footer">
      <span class="footer-rune">⚔ ✦ ⚔</span>
    </div>
  </aside>

  <!-- ── 回頂部按鈕 ──────────────────────────────── -->
  <button id="back-to-top" onclick="scrollToTop()" aria-label="回頂部">↑</button>

  <!-- ── 手機漢堡按鈕 ────────────────────────────── -->
  <button id="sidebar-toggle" aria-label="開關目錄" onclick="toggleSidebar()">☰</button>
  <!-- ── 手機側欄遮罩（點擊收合） ─────────────────── -->
  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <!-- ── 主內容 ──────────────────────────────────── -->
  <main id="content">
    <!-- 封面橫幅（讀取章節時常駐頂部） -->
    <div id="hero-band" class="hidden" aria-hidden="true">
      <div class="hb-veil"></div>
      <div class="hb-text">
        <span class="hb-title">前進柏德之門</span>
        <span class="hb-cast">影心 · 阿斯代倫 · 曹 · 卡拉克 · 貓咕咕</span>
      </div>
    </div>

    <!-- 閱讀進度條 -->
    <div id="progress-bar"></div>

    <!-- 裝飾框線（CSS overlay） -->
    <div class="content-frame" aria-hidden="true">
      <span class="corner corner-tl">✦</span>
      <span class="corner corner-tr">✦</span>
      <span class="corner corner-bl">✦</span>
      <span class="corner corner-br">✦</span>
    </div>

    <!-- 歡迎畫面 -->
    <div id="welcome">
      <div class="welcome-hero">
        <img src="data/images/cover.webp" alt="冒險隊伍" class="welcome-cover-img">
        <div class="welcome-cover-fade"></div>
      </div>
      <div class="welcome-inner">
        <h1 class="welcome-title">前進柏德之門</h1>
        <p class="welcome-sub">Journeys to Baldur's Gate</p>
        <div class="welcome-cast-block">
          <div class="cast-divider">── 冒險隊伍 ──</div>
          <div class="cast-names">游尚傑 · 林昱宇 · 曹祐誠 · 丁丁 · 昱如</div>
          <div class="cast-roles">影心 · 阿斯代倫 · 曹 · 卡拉克 · 貓咕咕</div>
        </div>
        <button class="welcome-cta" onclick="loadSession(sessions.slice().reverse().find(s=>!s.placeholder)?.id)">
          <span class="cta-arrow">⚔</span> 開始閱讀冒險日誌
        </button>
        <p id="welcome-latest" class="welcome-latest"></p>
        <p class="welcome-hint">或從左側選擇章節</p>
      </div>
    </div>

    <!-- 場次閱讀器 -->
    <article id="session-view" class="hidden">
      <header id="session-header">
        <div class="header-chapter" id="header-chapter"></div>
        <h1 class="header-title" id="header-title"></h1>
        <div class="header-date" id="header-date"></div>
        <div class="header-rule">
          <span class="rule-line"></span>
          <span class="rule-gem">⚜</span>
          <span class="rule-line"></span>
        </div>
      </header>

      <!-- 本集戰報（有 awards 資料才顯示） -->
      <div id="award-card" class="hidden"></div>

      <div id="session-body"></div>

      <footer class="session-footer">
        <button class="sf-card sf-prev" id="prev-btn" onclick="navigateSession(-1)">
          <span class="sf-dir">← 上一集</span>
          <span class="sf-chapter" id="sf-prev-chapter"></span>
          <span class="sf-title" id="sf-prev-title"></span>
        </button>
        <div class="sf-center">
          <div class="sf-ornament">⚔</div>
          <div class="sf-progress" id="footer-progress"></div>
        </div>
        <button class="sf-card sf-next" id="next-btn" onclick="navigateSession(1)">
          <span class="sf-dir">下一集 →</span>
          <span class="sf-chapter" id="sf-next-chapter"></span>
          <span class="sf-title" id="sf-next-title"></span>
        </button>
      </footer>
    </article>

    <!-- ── 角色頁面 ──────────────────────────────── -->
    <div id="characters-view" class="hidden content-scroll">
      <div id="characters-inner"></div>
    </div>

    <!-- ── 統計頁面 ──────────────────────────────── -->
    <div id="stats-view" class="hidden content-scroll">
      <div id="stats-inner"></div>
    </div>

    <!-- ── 里程碑頁面 ─────────────────────────────── -->
    <div id="milestones-view" class="hidden content-scroll">
      <div id="milestones-inner"></div>
    </div>

    <!-- ── 故事頁面 ──────────────────────────────── -->
    <div id="story-view" class="hidden content-scroll">
      <div id="story-inner"></div>
    </div>

  </main>

</div>

<script src="app.js?v=12"></script>
</body>
</html>
